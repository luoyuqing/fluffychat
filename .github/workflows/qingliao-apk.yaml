name: 清聊 APK 构建（签名）

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KS_PASS }}
      KEY_ALIAS: yomi
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        run: |
          FLUTTER_VERSION=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 构建（按 ABI 分包）
        run: flutter build apk --release --split-per-abi

      - name: 准备签名证书
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "使用已保存的证书"
          else
            keytool -genkeypair -keystore release.keystore \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Qingliao, O=qingliao"
            echo "生成新证书"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 签名
        run: |
          curl -sL -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer.jar \
            --apks build/app/outputs/apk/release/*.apk \
            --ks release.keystore --ksPass "$KS_PASS" \
            --ksAlias "$KEY_ALIAS" --ksKeyPass "$KS_PASS" \
            --out build/app/outputs/apk/signed --allowResign
          ls -la build/app/outputs/apk/signed/

      - name: 上传签名包
        uses: actions/upload-artifact@v4
        with:
          name: qingliao-signed-apks
          path: build/app/outputs/apk/signed/*-aligned-signed.apk

      - name: 上传证书（仅首次生成时）
        if: env.KEYSTORE_B64 == ''
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
